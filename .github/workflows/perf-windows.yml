name: Perf reference (Windows)

# The perf reference run (docs/perf.md, "Reference machine"): the perf bench on a GitHub-hosted
# windows-latest runner, several times with the default load and as many with the opt-in 1.1 load.
# The job summary shows the median, lowest and highest of each gated number against the budgets in
# bench/perf_budgets.gd, and the raw lines are kept as an artifact. It fails when a default-load
# median is over budget (the 1.1 load is reported only). It isn't a required check, so a miss shows
# here and doesn't block a merge.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs of each load
        default: "5"
  pull_request:
    paths:
      - "bench/**"
      - "tools/perf_bench.sh"
      - "docs/perf.md"
      - "addons/bustle/**"
      - ".github/workflows/perf-windows.yml"

permissions:
  contents: read

concurrency:
  group: perf-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RUNS: ${{ github.event.inputs.runs || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Godot
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          bin="$RUNNER_TEMP/godot-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_win64.exe.zip"
          7z x -y -o"$bin" "$RUNNER_TEMP/godot.zip" > /dev/null
          # The _console.exe wrapper gives a console process (stdout and exit codes), as in CI.
          printf '#!/usr/bin/env bash\nexec "%s/Godot_v%s_win64_console.exe" "$@"\n' "$bin" "$GODOT_TAG" > "$bin/godot"
          chmod +x "$bin/godot"
          cygpath -w "$bin" >> "$GITHUB_PATH"

      - name: Check Godot version matches the pin
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          version="$(godot --version | tr -d '\r' | tail -n 1)"
          echo "godot --version: $version"
          if [[ "$version" != "${GODOT_TAG%-stable}.stable."* ]]; then
            echo "::error::Godot reports ${version}, but tools/pins.env pins ${GODOT_TAG}."
            exit 1
          fi

      - name: Import
        run: godot --headless --path . --import > /dev/null 2>&1 || true

      # Each run is the whole of tools/perf_bench.sh. Its own gate verdict is report only: the runner's
      # bash has -e on, so it's turned off here, each run's exit code is noted, and every run goes
      # ahead. The medians below make the only pass or fail decision.
      - name: Run the default load
        run: |
          set +e
          set -uo pipefail
          mkdir -p build/perf-runs
          for i in $(seq 1 "$RUNS"); do
            echo "::group::default load, run $i of $RUNS"
            tools/perf_bench.sh --out "build/perf-runs/default-$i" 2>&1 | tr -d '\r' | tee -a build/perf-runs/default.log
            code="${PIPESTATUS[0]}"
            echo "::endgroup::"
            if [[ "$code" != "0" ]]; then
              echo "::warning title=Default load, run $i::perf_bench.sh exited $code (report only; the medians decide)."
            fi
          done

      - name: Run the opt-in 1.1 load
        if: always()
        run: |
          set +e
          set -uo pipefail
          mkdir -p build/perf-runs
          for i in $(seq 1 "$RUNS"); do
            echo "::group::1.1 load, run $i of $RUNS"
            tools/perf_bench.sh --load 1.1 --out "build/perf-runs/load-1.1-$i" 2>&1 | tr -d '\r' | tee -a build/perf-runs/load-1.1.log
            code="${PIPESTATUS[0]}"
            echo "::endgroup::"
            if [[ "$code" != "0" ]]; then
              echo "::warning title=1.1 load, run $i::perf_bench.sh exited $code (report only)."
            fi
          done

      - name: Median table
        if: always()
        run: |
          # The runner's bash has -e on; it's turned off here so that each table's exit code is read
          # from PIPESTATUS, and only the default load's decides the step.
          set +e
          set -uo pipefail
          out=build/perf-runs
          godot --headless --path . -s res://bench/perf_median.gd -- --label "Default load" "$out"/default-[0-9]* 2>&1 \
            | tr -d '\r' | sed -n '/^### /,$p' > "$out/default.md"
          default_code="${PIPESTATUS[0]}"
          godot --headless --path . -s res://bench/perf_median.gd -- --label "Opt-in 1.1 load" "$out"/load-1.1-[0-9]* 2>&1 \
            | tr -d '\r' | sed -n '/^### /,$p' > "$out/load-1.1.md"
          load_code="${PIPESTATUS[0]}"
          machine="$(grep -m1 '^machine: ' "$out/default.log" || echo 'machine: unknown')"
          {
            echo "## Perf reference: GitHub windows-latest"
            echo
            echo "- ${machine}"
            echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "- Commit: \`${GITHUB_SHA}\`, ${RUNS} runs of each load"
            echo "- Budgets: \`bench/perf_budgets.gd\`. The default load's medians are judged; the 1.1 load is reported only."
            echo
            cat "$out/default.md"
            echo
            cat "$out/load-1.1.md"
          } | tee "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$load_code" != "0" ]]; then
            echo "::warning title=1.1 load::A 1.1-load median is over budget or a run is incomplete (reported only)."
          fi
          if [[ "$default_code" != "0" ]]; then
            echo "::error title=Default load::A default-load median is over budget or a run is incomplete (see the summary)."
            exit 1
          fi
          echo "::notice title=Default load::Every default-load median is within budget."

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-windows-results
          path: build/perf-runs/
