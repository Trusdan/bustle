name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Windows: the full GUT suite, the example project and the release zips' published hashes (the
  # hygiene and editor checks run in `test`).
  test-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Godot
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          bin="$RUNNER_TEMP/godot-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_win64.exe.zip"
          7z x -y -o"$bin" "$RUNNER_TEMP/godot.zip" > /dev/null
          # The _console.exe wrapper gives a console process (stdout and exit codes) and starts
          # the main exe next to it, so both keep their names and a small shim is the `godot` command.
          printf '#!/usr/bin/env bash\nexec "%s/Godot_v%s_win64_console.exe" "$@"\n' "$bin" "$GODOT_TAG" > "$bin/godot"
          chmod +x "$bin/godot"
          cygpath -w "$bin" >> "$GITHUB_PATH"

      - name: Check Godot version matches the pin
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          version="$(godot --version | tr -d '\r' | tail -n 1)"
          echo "godot --version: $version"
          expected="${GODOT_TAG%-stable}.stable."
          if [[ "$version" != "$expected"* ]]; then
            echo "::error::Godot reports ${version}, but tools/pins.env pins ${GODOT_TAG}."
            exit 1
          fi
          echo "::notice title=Godot on Windows::${version} (pinned ${GODOT_TAG})"

      - name: Import and test
        run: |
          set -euo pipefail
          tools/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/gut.log"
          # Surface GUT's totals as a notice, so the run page shows what ran on Windows.
          totals="$(tr -d '\r' < "$RUNNER_TEMP/gut.log" | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -E '^(Scripts|Tests|Passing Tests|Asserts) ' | tr -s ' ' | paste -sd ',' -)"
          echo "::notice title=GUT on Windows::${totals}"

      # The standalone example project (examples/village/): loads headless with no errors.
      - name: Example project loads headless
        run: tools/example.sh --check

      # The release zips come out byte-identical on Windows too: v0.9.0 gives its published hashes.
      - name: Release zips reproduce the published hashes
        run: tools/test_build_release.sh

  # The core addon on its own: the optional Wyrd bridge, the vendored Wyrd and their tests are
  # deleted first, so the core never depends on them.
  test-core-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Godot
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          mkdir -p "$HOME/.local/bin" /tmp/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot-bin
          install -m 0755 "/tmp/godot-bin/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Remove the Wyrd bridge, vendored Wyrd and their tests
        run: rm -rf addons/bustle_wyrd addons/wyrd tests/wyrd

      - name: Import and test
        run: |
          set -euo pipefail
          tools/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/gut.log"
          totals="$(tr -d '\r' < "$RUNNER_TEMP/gut.log" | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -E '^(Scripts|Tests|Passing Tests|Asserts) ' | tr -s ' ' | paste -sd ',' -)"
          echo "::notice title=GUT core only::${totals}"

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # addons/wyrd/ is a test-only copy of a Wyrd release; it must match tools/wyrd-pin.env exactly.
      - name: Vendored Wyrd matches its pin
        run: tools/check_wyrd_pin.sh

      # README.md and addons/bustle/plugin.cfg state the supported Godot range; it must match
      # GODOT_TAG in tools/pins.env. The self-test proves the check fails on each kind of drift.
      - name: Supported Godot range matches the pin
        run: |
          tools/check_godot_range.sh
          tools/test_check_godot_range.sh

      # Each plugin folder carries an exact copy of the root LICENSE and a README.md, so a project
      # that copies only that folder keeps them. Fails when a copy drifts; the self-test checks it.
      - name: Plugin folders' license copies match LICENSE
        run: |
          tools/check_license_copies.sh
          tools/test_check_license_copies.sh

      - name: Install pinned Godot
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          mkdir -p "$HOME/.local/bin" /tmp/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot-bin
          install -m 0755 "/tmp/godot-bin/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/godot" --version

      - name: Import and test
        run: |
          set -euo pipefail
          tools/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/gut.log"
          # Surface GUT's totals as a notice, so the run page shows what ran on Ubuntu.
          totals="$(tr -d '\r' < "$RUNNER_TEMP/gut.log" | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -E '^(Scripts|Tests|Passing Tests|Asserts) ' | tr -s ' ' | paste -sd ',' -)"
          echo "::notice title=GUT on Ubuntu::${totals}"

      # A short demo soak (docs/perf.md): two game days of each demo from seed 1, run twice. It fails
      # when an agent is stuck or the replay's timeline hash differs; both are deterministic, so this
      # isn't report-only. The full 30-day soak runs nightly (soak.yml).
      - name: Soak smoke (2 days, same-seed replay)
        run: |
          set -euo pipefail
          out="$(godot --headless --path . -s res://bench/soak.gd -- --days=2 2>&1 | tr -d '\r' | grep -E '^soak' || true)"
          echo "$out"
          while IFS= read -r line; do echo "::notice title=Soak smoke::${line}"; done <<< "$out"
          [[ "$(grep -c ': OK$' <<< "$out")" == "2" ]]

      # The perception bench (docs/perf.md). A report only: shared runners' timings vary.
      - name: Perception bench (report only)
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(godot --headless --path . -s res://bench/perception_bench.gd 2>&1 | tr -d '\r' | grep -E '^perception bench: [0-9]' || true)"
          echo "$out"
          mkdir -p "$RUNNER_TEMP/perf" && printf '%s\n' "$out" > "$RUNNER_TEMP/perf/perception.txt"
          echo "::notice title=Perception bench::${out}"
          [[ "$out" == *": OK" ]]

      # The ring bench (docs/perf.md). A report only: shared runners' timings vary.
      - name: Ring bench (report only)
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(godot --headless --path . -s res://bench/rings_bench.gd 2>&1 | tr -d '\r' | grep -E '^rings bench: [0-9]' || true)"
          echo "$out"
          mkdir -p "$RUNNER_TEMP/perf" && printf '%s\n' "$out" > "$RUNNER_TEMP/perf/rings.txt"
          echo "::notice title=Ring bench::${out}"
          [[ "$out" == *": OK" ]]

      # The population bench (docs/perf.md): 40 FULL, 40 LIGHT and 200 OFF_SCREEN agents against the
      # budgets, plus a game day with nobody stuck. A report only: shared runners' timings
      # vary, and no number here is a claim about a minimum machine.
      - name: Population bench (report only)
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(godot --headless --path . -s res://bench/population_bench.gd 2>&1 | tr -d '\r' | grep -E '^population bench: [0-9]' || true)"
          echo "$out"
          mkdir -p "$RUNNER_TEMP/perf" && printf '%s\n' "$out" > "$RUNNER_TEMP/perf/population.txt"
          echo "::notice title=Population bench::${out}"
          [[ "$out" == *": OK" ]]

      # The performance gate (docs/perf.md, "Budgets and the CI gate"). The three report steps
      # above stay report-only at 1x budget; this step judges their lines against
      # bench/perf_budgets.gd and fails the job only on a large regression: a timing above
      # CI_HEADROOM (2x) its budget, a save over its budget, a stuck agent, or a bench that
      # printed no summary line.
      - name: Performance gate (2x budget)
        run: |
          set -euo pipefail
          set +e
          out="$(godot --headless --path . -s res://bench/perf_gate.gd -- "$RUNNER_TEMP/perf" 2>&1 | tr -d '\r')"
          code=$?
          set -e
          grep -E '^(machine: |ok |FAIL |perf gate |usage: )' <<< "$out" || echo "$out"
          echo "::notice title=Performance gate::$(grep -E '^perf gate ' <<< "$out" || echo 'no verdict')"
          exit "$code"

      # docs/api/ is generated from the ## doc comments; fail if a comment changed without
      # regenerating it (run tools/gen_api_docs.sh and commit the result).
      - name: API docs are up to date
        run: tools/gen_api_docs.sh --check

      # docs/config.md is generated from every @export field and project setting, with ranges from
      # tools/config_reference/ranges.tsv; fail if it is stale or a number field has no range.
      - name: Configuration reference is up to date
        run: tools/config_reference.sh --check

      # docs/public-api/VERSIONING.md: a frozen symbol removed, renamed or changed fails unless
      # docs/public-api/deprecations.json has an entry for it; new symbols pass. On a pull request
      # it also compares with the base branch's manifest, so editing the committed one can't hide a break.
      - name: Public API keeps its frozen symbols
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            tools/public_api.sh --check --base "origin/${GITHUB_BASE_REF}"
          else
            tools/public_api.sh --check
          fi

      # docs/saves.md: the committed golden save fixtures are exactly what the tagged releases
      # write. It regenerates each from its tag in a temporary worktree and fails on any difference.
      - name: Save fixtures match the tags
        run: tools/save_fixtures.sh --check

      - name: Release zips build reproducibly
        run: tools/build_release.sh --check --list --out "$RUNNER_TEMP/release"

      # The pinned compressor matches classic zlib (this runner's) byte for byte on every tracked
      # file, v0.9.0 gives its published hashes, and a wrong hash fails the build.
      - name: Release zips reproduce the published hashes
        run: tools/test_build_release.sh --require-classic

      # docs/RELEASE.md: the source archive (what the Asset Library installs from) holds only the
      # addons, LICENSE and README.md, and its addons load in a fresh project with no errors or
      # warnings, the Wyrd bridge without Wyrd included. v0.9.0 and a too-wide rule must fail.
      - name: Source archive holds only the addons
        run: tools/test_check_source_archive.sh --load

      - name: Asset Library icon matches its SVG
        run: godot --headless --path . -s res://tools/asset_library/render_icon.gd -- --check

      # Opens the project in the editor (headless) with the Bustle and GUT plugins
      # enabled. Fails on a non-zero exit, on any ERROR / SCRIPT ERROR line, or if
      # project.godot is not in Godot's own format (the GUI editor would rewrite it).
      - name: Editor loads plugins without errors
        run: |
          set -euo pipefail
          for cfg in res://addons/bustle/plugin.cfg res://addons/gut/plugin.cfg; do
            if ! grep -q -F "\"$cfg\"" project.godot; then
              echo "::error::$cfg is not enabled under [editor_plugins] in project.godot."
              exit 1
            fi
          done

          log="$(mktemp)"
          resave="$(mktemp --suffix=.gd)"
          trap 'rm -f "$log" "$resave"' EXIT
          set +e
          godot --headless --editor --path . --quit-after 120 >"$log" 2>&1
          code=$?
          set -e
          cat "$log"

          if [[ "$code" -ne 0 ]]; then
            echo "::error::The editor exited with code ${code}."
            exit 1
          fi
          # Known noise, ignored on purpose: GUT's editor plugin checks online for a newer
          # GUT once a day and logs this one ERROR when the request fails or times out.
          if grep -v -F '[GUT] Could not get version info' "$log" | grep -q -E 'ERROR'; then
            echo "::error::The editor logged an ERROR while loading the project. See the log above."
            exit 1
          fi
          # The headless editor never saves project.godot, so ask Godot to re-save it in
          # its own format and fail if that changes the committed file.
          printf '%s\n' 'extends SceneTree' 'func _init() -> void:' \
            '	var err: Error = ProjectSettings.save()' '	quit(0 if err == OK else 1)' > "$resave"
          godot --headless --path . -s "$resave" >/dev/null 2>&1
          if ! git diff --quiet -- project.godot; then
            git diff -- project.godot
            echo "::error::project.godot is not in Godot's own format, so the editor would rewrite it. Commit the formatting shown above."
            exit 1
          fi
          echo "Editor loaded the project and plugins with no errors."

      # The standalone example project (examples/village/), in its own project with a copy of the
      # addon: import, its two-day check, the main scene and the editor, with no errors or warnings.
      - name: Example project loads headless
        run: tools/example.sh --check

      # Proves the hygiene check itself with made-up terms: an added term fails, a removed one
      # passes, vendored folders are skipped, and the term is never printed.
      - name: Content hygiene self-test
        if: always()
        run: tools/test_check_hygiene.sh

      # Fails if any term from the BUSTLE_HYGIENE_TERMS secret (one per line, case-insensitive,
      # fixed string) appears in a line this change adds. It never prints the terms or the
      # matching lines. Vendored GUT and Wyrd are excluded.
      - name: Content hygiene
        if: always()
        env:
          HYGIENE_TERMS: ${{ secrets.BUSTLE_HYGIENE_TERMS }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_REF:-}" ]]; then
            range="origin/${BASE_REF}...HEAD"
          elif [[ -n "${PUSH_BEFORE:-}" && ! "${PUSH_BEFORE}" =~ ^0+$ ]]; then
            range="${PUSH_BEFORE}..HEAD"
          else
            echo "::warning::No base revision to diff against; skipping the content-hygiene check."
            exit 0
          fi
          tools/check_hygiene.sh "$range"
